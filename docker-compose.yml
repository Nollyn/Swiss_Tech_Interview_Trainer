services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DatabaseProvider=Postgres
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=swisstechtrainer;Username=postgres;Password=postgres
      - LLM__Provider=Mock
      - LLM__ApiKey=${GROQ_API_KEY:-}
      - LLM__Model=llama-3.3-70b-versatile
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swisstechtrainer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
